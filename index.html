<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Sự Kiện Lớp Học</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="midautumn">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="setup-screen" class="admin-wrap" style="justify-content:center; padding:30px;">
        <h2 style="text-align:center; color:var(--accent); font-size:2rem; margin-bottom:20px;">HỘI TRƯỜNG SỰ KIỆN</h2>
        <input type="text" id="room-in" placeholder="Mã phòng (vd: 12A1)" style="padding:15px; margin-bottom:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; font-weight:bold;">
        <input type="password" id="pass-in" placeholder="Mật khẩu Admin" style="padding:15px; margin-bottom:20px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff;">
        <button onclick="join('display')" style="background:var(--accent); color:#000; padding:15px; border:none; border-radius:10px; font-weight:bold; margin-bottom:12px; font-size:1.1rem;">KẾT NỐI TIVI / MÁY CHIẾU</button>
        <button onclick="join('host')" style="background:transparent; border:2px solid var(--accent); color:var(--accent); padding:15px; border-radius:10px; font-weight:bold; font-size:1.1rem;">ĐIỀU KHIỂN (ADMIN)</button>
    </div>

    <!-- MÀN HÌNH ĐIỀU KHIỂN (HOST MOBILE) -->
    <div id="host-screen" class="hidden admin-wrap">
        <!-- Bộ chọn Event & Theme nhanh -->
        <div style="padding:10px 15px; background:rgba(0,0,0,0.4); display:flex; gap:10px; align-items:center;">
            <select id="event-selector" onchange="onEventChange()" style="flex:1; padding:8px; border-radius:8px; background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.3); font-weight:bold;"></select>
            <button onclick="sendStandby()" style="background:#6c757d; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-weight:bold;">Xóa TV</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ctrl')">ĐIỀU KHIỂN</button>
            <button class="tab-btn" onclick="switchTab('list')">QUẢN LÝ CÂU HỎI</button>
        </div>

        <!-- Tab 1: Bảng Điều Khiển Trực Tiếp -->
        <div id="tab-ctrl" class="content">
            <div style="background:rgba(255,255,255,0.06); padding:15px; border-radius:15px; margin-bottom:15px; border:1px solid rgba(255,255,255,0.1);">
                <p id="now-p" style="margin:0 0 10px 0; font-weight:bold; color:var(--accent); text-align:center;">Đang đợi lệnh...</p>
                
                <!-- Bấm chọn đáp án thay cho TV -->
                <div id="admin-options-container" style="margin-bottom:10px;"></div>

                <div id="live-btns" class="hidden" style="display:flex; flex-direction:column; gap:8px;">
                    <button id="btn-reveal-next" onclick="sendStep('reveal_next')" class="hidden" style="background:#17a2b8; color:#fff; padding:12px; border:none; border-radius:8px; font-weight:bold;">HIỆN ĐÁP ÁN TIẾP THEO</button>
                    
                    <div style="display:flex; gap:6px;">
                        <button onclick="startTimer(15)" style="flex:1; background:rgba(255,183,3,0.2); border:1px solid var(--accent); color:var(--accent); padding:8px; border-radius:6px; font-weight:bold;">15s</button>
                        <button onclick="startTimer(30)" style="flex:1; background:rgba(255,183,3,0.2); border:1px solid var(--accent); color:var(--accent); padding:8px; border-radius:6px; font-weight:bold;">30s</button>
                        <button onclick="startTimer(45)" style="flex:1; background:rgba(255,183,3,0.2); border:1px solid var(--accent); color:var(--accent); padding:8px; border-radius:6px; font-weight:bold;">45s</button>
                    </div>

                    <div style="display:flex; gap:8px;">
                        <button onclick="sendStep('check_choice')" style="flex:1; background:#fb8500; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:bold;">KIỂM TRA Ô CHỌN</button>
                        <button onclick="sendStep('reveal_correct')" style="flex:1; background:#2ec4b6; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:bold;">MỞ ĐÁP ÁN ĐÚNG</button>
                    </div>
                </div>
            </div>

            <div id="picker-zone-ctrl"></div>
            <div id="play-list"></div>
        </div>

        <!-- Tab 2: Quản Lý Câu Hỏi Của Sự Kiện -->
        <div id="tab-list" class="content hidden">
            <button onclick="openModal()" style="width:100%; background:var(--accent); color:#000; border:none; padding:14px; border-radius:10px; font-weight:bold; margin-bottom:15px;">+ TẠO CÂU HỎI MỚI</button>
            <div id="sortable-area"></div>
        </div>
    </div>

    <!-- MÀN HÌNH TIVI (DISPLAY) -->
    <div id="display-screen" class="hidden">
        <div id="tv-timer" class="hidden">15</div>
        <h1 id="tv-title">CHÀO MỪNG ĐẾN VỚI SỰ KIỆN</h1>
        <div class="grid" id="tv-grid"></div>
    </div>

    <!-- MODAL TẠO/SỬA CÂU HỎI -->
    <div id="modal-box" class="modal-overlay hidden">
        <div class="modal">
            <h3 style="margin-top:0; color:var(--accent);">Soạn Câu Hỏi</h3>
            <input type="hidden" id="edit-id">
            <textarea id="edit-text" placeholder="Nội dung câu hỏi..." style="width:100%; height:70px; padding:10px; border-radius:8px; border:1px solid #555; background:#2c283e; color:#fff; margin-bottom:12px;"></textarea>
            
            <div style="font-size:0.9rem; font-weight:bold; margin-bottom:8px; color:var(--accent);">Lựa chọn (Tích chọn ô ĐÚNG):</div>
            <div id="opt-box"></div>
            <button onclick="addOptRow()" style="width:100%; padding:8px; border:1px dashed #777; background:none; color:#bbb; border-radius:6px; margin-bottom:15px;">+ Thêm dòng</button>

            <div style="display:flex; gap:10px;">
                <button onclick="closeModal()" style="flex:1; background:#444; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:bold;">Hủy</button>
                <button onclick="saveQ()" style="flex:1; background:var(--accent); color:#000; border:none; padding:12px; border-radius:8px; font-weight:bold;">Lưu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
